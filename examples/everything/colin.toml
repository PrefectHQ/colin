[project]
name = "everything"
model-path = "models"

[project.output]
path = "output"

[[providers.llm]]
model = "anthropic:claude-haiku-4-5"

[[providers.mcp]]
name = "demo"
command = "uvx"
args = [
    "--with",
    "fastmcp",
    "fastmcp",
    "run",
    "--no-banner",
    "--log-level",
    "ERROR",
    "examples/everything/mcp_server.py",
]
