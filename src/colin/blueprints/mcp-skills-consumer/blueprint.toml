[blueprint]
name = "mcp-skills-consumer"
description = "Download and track skills from an MCP server"
instructions = """
Add your skills server:
  colin mcp add source "uvx my-skills-server"

Or configure in colin.toml:
  [[providers.mcp]]
  name = "source"
  command = "uvx"
  args = ["my-skills-server"]

Download skills:
  colin run
"""
