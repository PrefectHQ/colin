name: Claude Issue Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  triage:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub MCP Server
        run: |
          mkdir -p /tmp/mcp-config
          cat > /tmp/mcp-config/mcp-servers.json << 'EOF'
          {
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run",
                  "-i",
                  "--rm",
                  "-e",
                  "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:sha-7aced2b"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                }
              }
            }
          }
          EOF

      - name: Run Claude for Triage
        timeout-minutes: 5
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_non_write_users: "*"
          prompt: |
            You're triaging issues and PRs for Colin, a context compiler for AI agents.

            IMPORTANT: Your ONLY action should be to apply labels. DO NOT post comments.

            - REPO: ${{ github.repository }}
            - NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
            - TYPE: ${{ github.event.issue && 'issue' || 'pull_request' }}

            PROCESS:

            1. Get available labels: `gh label list`

            2. Get issue/PR details using GitHub MCP tools:
               - mcp__github__get_issue: Get issue/PR details
               - mcp__github__get_issue_comments: Read discussion
               - mcp__github__search_issues: Find similar/duplicate issues

            3. Analyze and select labels:

            CATEGORY (apply exactly one):
            - bug: Broken functionality or PRs fixing bugs
            - enhancement: Improvements, minor new capabilities
            - feature: Major new functionality (rare - headline features only)
            - documentation: Primary change is to user-facing docs
            - idea: Feature request needing design discussion

            AREA (apply if central to the issue):
            - compiler: Core compilation pipeline, resolution, transforms
            - cli: CLI commands or command-line interface
            - provider: Provider implementations or protocols
            - tests: Test additions or infrastructure

            STATUS (apply if applicable):
            - good first issue: Clearly scoped, obvious solution
            - duplicate: Already exists (only if duplicate of OPEN issue)
            - invalid: Spam or off-topic
            - ignore in release notes: Meta/workflow changes only

            RULES:
            - Apply 1-3 labels (category + maybe 1 area)
            - Be selective - only labels that clearly fit
            - When in doubt, skip the area label
            - DO NOT post comments

            4. Apply labels using mcp__github__update_issue

          claude_args: |
            --model claude-sonnet-4-5
            --mcp-config /tmp/mcp-config/mcp-servers.json
            --allowedTools "Bash(gh label list),mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__update_issue,mcp__github__search_issues,mcp__github__get_pull_request_files"
