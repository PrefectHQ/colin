name: Claude Issue Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Clean up stale Claude locks
        run: rm -rf ~/.claude/.locks ~/.local/state/claude/locks || true

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_non_write_users: "*"
          prompt: |
            You're triaging issues/PRs for Colin, a context compiler for AI agents.

            IMPORTANT: Your ONLY action should be to apply labels using mcp__github__update_issue. DO NOT post comments.

            - REPO: ${{ github.repository }}
            - NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
            - TYPE: ${{ github.event.issue && 'issue' || 'pull_request' }}

            PROCESS:

            1. Get available labels: `gh label list`

            2. Get issue/PR details using mcp__github__get_issue

            3. Apply labels based on these guidelines:

            CATEGORY (apply exactly one):
            - bug: Broken functionality or PRs fixing bugs
            - enhancement: Improvements, minor new capabilities
            - feature: Major new functionality (new providers, new commands)
            - documentation: Primary change is to user-facing docs
            - idea: Feature request needing design discussion

            AREA (apply if central to the issue):
            - cli: CLI commands or interface
            - compiler: Core compilation pipeline
            - provider: Provider implementations
            - tests: Test infrastructure

            RULES:
            - Apply 1-3 labels (category + maybe 1 area)
            - Be selective - only labels that clearly fit
            - DO NOT post comments

            4. Apply labels using mcp__github__update_issue

          claude_args: |
            --allowedTools Bash(gh label list),mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__update_issue,mcp__github__get_pull_request_files
          settings: |
            {
              "model": "claude-sonnet-4-5",
              "env": {
                "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
              }
            }
